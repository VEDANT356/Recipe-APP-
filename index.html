<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Recipe App</title>
</head>

<body>

<header>
  <nav>
    <h1>Recipe App</h1>
    <form>
      <input type="text" placeholder="search for a recipe ..." class="searchBox"/>
      <button type="submit" class="searchBtn">Search</button>
    </form>
  </nav>
</header>

<main>
  <section>
    <div class="recipe-container">
      <h2>Search your favorite recipes</h2>
    </div>
  </section>
</main>


<div class="recipe-modal" id="recipeModal">
  <div class="recipe-content">
    <button class="close-btn" onclick="closeRecipe()">X</button>

    <h2 id="recipeTitle"></h2>

    <h3>Ingredients:</h3>
    <ul id="recipeIngredients"></ul> 
    <h3~>Instructions:</h3>
    <p id="recipeInstructions"></p>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
